name: Build & Release SummifySocial APK

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-disabled: true

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Ensure Release Keystore exists
        run: |
          if [ ! -f android/app/release.keystore ]; then
            echo "Generating release keystore..."
            keytool -genkeypair -v -keystore android/app/release.keystore -alias summify -keyalg RSA -keysize 2048 -validity 10000 -storepass summifykeystore -keypass summifykeystore -dname "CN=SummifySocial, OU=App, O=SummifySocial, L=City, ST=State, C=US"
          fi

      - name: Build Signed Release APK
        working-directory: android
        run: |
          ./gradlew assembleRelease --stacktrace 2>&1 | tee ../build.log
          BUILD_STATUS=${PIPESTATUS[0]}
          if [ $BUILD_STATUS -ne 0 ]; then
            echo "::error::Gradle build failed with exit code $BUILD_STATUS"
            echo "=========================================="
            echo "FULL GRADLE BUILD LOG:"
            cat ../build.log
            echo "=========================================="
            exit $BUILD_STATUS
          fi

      - name: Push Build Log to Repo for Diagnostics
        if: failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B diagnostics-log
          git add -f build.log
          git commit -m "ci: upload build.log for diagnostics" || true
          git push -f origin diagnostics-log || true

      - name: Upload Build Log on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: build.log

      - name: Prepare APK for Release
        run: |
          mkdir -p build-output
          APK_PATH=$(find android/ -name "*.apk" | grep -v "androidTest" | head -n 1)
          if [ -n "$APK_PATH" ]; then
            cp "$APK_PATH" build-output/SummifySocial.apk
            echo "Successfully prepared APK: $APK_PATH -> build-output/SummifySocial.apk"
            ls -lh build-output/SummifySocial.apk
          else
            echo "ERROR: No APK found!" && exit 1
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SummifySocial-APK
          path: build-output/SummifySocial.apk
          retention-days: 30

      - name: Publish or Update 'latest' GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "SummifySocial v1.0.0 (Latest APK)"
          body: |
            ### 🌐 SummifySocial Android APK v1.0.0
            - **Floating Quick-Verify Assistant:** 44dp floating bubble matching Bypass style — docks flush to screen edges, tucks 48% behind bezel, and dims down to 40% after 2.5s idle.
            - **Auto Clipboard Ingestion:** Copy any link from X (Twitter), Facebook, TikTok, YouTube, Reddit, Instagram, or Threads — SummifySocial auto-detects and verifies the post with accuracy scores and cross-referenced sources.
            - **AI Summarization & Multi-Source Corroboration:** Instantly explains claims with key bullet takeaways and source credibility checks.
            - **Direct APK Download:** Tap **`SummifySocial.apk`** below to download and install on your Android device.
          files: build-output/SummifySocial.apk
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
